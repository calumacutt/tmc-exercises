<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Movement Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --bg-soft: #1C1814;
    --panel: #221D18;
    --line: #3A322A;
    --ink: #EDE6DA;
    --ink-soft: #B3A892;
    --ink-faint: #756B5C;
    --accent: #C9A227;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Masthead ---------- */
  header {
    width: 100%;
    text-align: center;
    padding: 32px 24px 12px;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  header h1 .italic {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
  }

  /* ---------- Control bar ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px 22px;
    padding: 14px 24px;
    margin: 8px 0 4px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    width: min(1100px, 94vw);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .control-group .label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  button.btn {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  button.btn:hover { border-color: var(--ink-soft); }
  button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.btn.primary {
    background: var(--accent);
    color: #1A1408;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.btn.primary:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.4; cursor: default; }

  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 3px; border-radius: 2px;
    background: var(--line); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); border: none;
  }
  .imp-value {
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--ink-soft);
    min-width: 132px;
  }

  .toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-soft); cursor: pointer; user-select: none;
  }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  /* ---------- Stage ---------- */
  .stage {
    width: min(1000px, 96vw);
    padding: 10px 0 60px;
    position: relative;
  }
  #wheel { width: 100%; height: auto; display: block; }

  .status {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 80px 24px;
    line-height: 1.7;
  }
  .status strong { color: var(--ink-soft); font-weight: 500; }

  .hint {
    text-align: center;
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding-bottom: 40px;
  }

  /* hidden file input */
  #file { display: none; }

  /* ---------- Tuning panel ---------- */
  .tune-panel {
    width: min(1000px, 96vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 4px 0 0;
    overflow: hidden;
  }
  .tune-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; cursor: pointer; user-select: none;
    font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft);
  }
  .tune-head:hover { color: var(--ink); }
  .tune-head .chev { transition: transform 0.18s; font-size: 10px; color: var(--ink-faint); }
  .tune-panel.collapsed .tune-body { display: none; }
  .tune-panel.collapsed .chev { transform: rotate(-90deg); }
  .tune-body {
    padding: 6px 16px 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 6px 28px;
  }
  .tune-group-title {
    grid-column: 1 / -1;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); margin: 10px 0 2px; font-weight: 600;
  }
  .tune-row {
    display: grid; grid-template-columns: 1fr 120px 46px; align-items: center;
    gap: 10px; font-size: 12px; color: var(--ink-soft);
  }
  .tune-row label { line-height: 1.25; }
  .tune-row input[type="range"] { width: 100%; }
  .tune-row .val { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
  .tune-actions { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 12px; }

  /* Wheel text styles (also inlined on export) */
  .w-pillar-label { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
  .w-disc-label { font-family: 'Archivo', sans-serif; font-weight: 600; letter-spacing: 0.02em; }
  .w-ex-label { font-family: 'Archivo', sans-serif; font-weight: 400; }
  .w-center-title { font-family: 'Fraunces', Georgia, serif; }
  .w-center-sub { font-family: 'Archivo', sans-serif; letter-spacing: 0.18em; }

  @media (max-width: 640px) {
    .controls { gap: 12px 16px; }
    input[type="range"] { width: 100px; }
  }
</style>
</head>
<body>
  <header>
    <h1>The Ultimate Mover</h1>
  </header>

  <div class="controls">
    <div class="control-group">
      <span class="label">Data</span>
      <button class="btn" id="btn-upload">Upload CSV</button>
      <button class="btn" id="btn-url">Load from Sheet</button>
      <input type="file" id="file" accept=".csv,text/csv">
    </div>
    <div class="control-group">
      <span class="label">Importance</span>
      <div class="slider-wrap">
        <input type="range" id="imp" min="1" max="3" step="1" value="2">
        <span class="imp-value" id="imp-value">1–2 shown</span>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="variants"> Show variants
    </label>
    <div class="control-group">
      <span class="label">Save</span>
      <button class="btn" id="btn-png" disabled>PNG</button>
      <button class="btn" id="btn-svg" disabled>SVG</button>
    </div>
  </div>

  <div class="tune-panel collapsed" id="tune-panel">
    <div class="tune-head" id="tune-head">
      <span>⚙ Layout forces — tune the spacing</span>
      <span class="chev">▼</span>
    </div>
    <div class="tune-body" id="tune-body"></div>
  </div>

  <div class="stage">
    <div class="status" id="status">
      <strong>Load your exercise data to draw the wheel.</strong><br>
      Upload a CSV exported from the database, or pull the latest straight from the published Sheet.
    </div>
    <svg id="wheel" style="display:none" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
<script type="module">
/* ============================================================
   THE MOVEMENT WHEEL — page shell and boot
   Radial constellation: 5 pillars -> disciplines -> exercises.

   This file wires the DOM to the modules and owns nothing else. All real logic
   lives in the modules, per CLAUDE.md §3: browsers cannot import HTML
   fragments, so the page stays a thin shell.

   ES modules need an HTTP origin. Opening this file with file:// will NOT work
   any more — run tools/serve.ps1 and use http://localhost:8000/wheel/.
   ============================================================ */

import { parseCSV, rowsToObjects } from '../shared/csv.js';
import { normaliseRows } from '../shared/library.js';
import { state, IMP_SLIDER_MAX } from './state.js';
import { buildTunePanel } from './tune.js';
import { render, showStatus } from './render.js';

// ---- Published Google Sheet CSV URL (Exercises tab) ----
// The other two tabs are recorded in data/SHEET.md.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDrwHw-jGM7r3ZO_i8orZWvJ_wxmMdfnUy3lvdsqwZeJGv_EyEvsiB1HxG1qrXIyzgtMrlZMhirtcI/pub?gid=955669041&single=true&output=csv";

const rerender = () => { if (state.RAW.length) render(); };

// ---- data loading ----
function ingest(text) {
  try {
    state.RAW = normaliseRows(rowsToObjects(parseCSV(text)));
    if (!state.RAW.length) {
      showStatus("No exercises found in that file. Is it the Exercises export with a <strong>Name</strong> column?");
      return;
    }
    render();
  } catch (err) {
    showStatus("Couldn't read that file. " + (err.message || ""));
  }
}

document.getElementById('btn-upload').addEventListener('click', () => {
  document.getElementById('file').click();
});
document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => ingest(reader.result);
  reader.onerror = () => showStatus("That file couldn't be read.");
  reader.readAsText(f);
});

document.getElementById('btn-url').addEventListener('click', async () => {
  showStatus("Fetching the latest data from the Sheet…");
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    ingest(await res.text());
  } catch (err) {
    showStatus("Couldn't reach the published Sheet.<br>Check the link is published to the web and the network is available.<br><span style='color:var(--ink-faint)'>" + (err.message || "") + "</span>");
  }
});

// ---- controls ----
const impSlider = document.getElementById('imp');
const impValue = document.getElementById('imp-value');
const impLabel = v => v <= 1 ? "1 only" : "1–" + v + " shown";

impSlider.max = IMP_SLIDER_MAX;
impSlider.value = state.impMax;
impValue.textContent = impLabel(state.impMax);

impSlider.addEventListener('input', () => {
  state.impMax = parseInt(impSlider.value, 10);
  impValue.textContent = impLabel(state.impMax);
  rerender();
});

document.getElementById('variants').addEventListener('change', (e) => {
  state.showVariants = e.target.checked;
  rerender();
});

// ---- tuning panel ----
buildTunePanel(rerender);
</script>
</body>
</html>
